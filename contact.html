      <h2 class="contact-heading">Booking</h2>
      <p class="contact-name">Calen Miller</p>
      <p class="contact-detail"><a href="tel:13062916286">306.291.6286</a></p>
      <p class="contact-detail"><a href="mailto:thebasementpaintings@gmail.com">thebasementpaintings@gmail.com</a></p>
    </div>

    <hr class="bio-divider">

    <div class="contact-section">
      <h2 class="contact-heading contact-heading--split"><span>All Other</span> <span>Inquiries</span></h2>

      <div class="form-success" id="formSuccess" hidden>
        <p>Thanks — your message has been sent. We'll get back to you soon.</p>
      </div>

      <form class="contact-form" name="contact" method="POST" data-netlify="true" action="/contact.html?success=1">
        <input type="hidden" name="form-name" value="contact">

        <div class="form-row">
          <div class="form-group">
            <label for="first-name">First Name</label>
            <input type="text" id="first-name" name="first-name" required>
          </div>
          <div class="form-group">
            <label for="last-name">Last Name</label>
            <input type="text" id="last-name" name="last-name" required>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" required>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>

        <button type="submit" class="btn-submit">Submit</button>
      </form>
    </div>
  </div>
